name: CI test PR query

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Git SHA to look up'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Comment on merged PR
        uses: actions/github-script@v6
        with:
          script: |
            const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: "${{ github.event.inputs.sha }}" || github.sha,
            });
            
            if (pullRequests.length > 0) {
              console.log(`Found ${pullRequests.length} associated PR(s).`);
              const prNumber = pullRequests[0].number;
              console.log(`Using first PR: ${prNumber}`);
              
              await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: 'The merge build on master was successful!'
              });
            } else {
              console.log('No PR found for: ${{ github.event.inputs.sha }}');
            }
    