# All-in-one continuous integration (CI) workflow.
# Runs on all platforms (Windows, macOS, and Linux)
# for all events (pull request, release, and schedule).

name: CI

on:
  workflow_dispatch:
    inputs:
      package-type:
        description: "dev (commit SHA), snapshot (nightly), release (clean semver)"
        required: false
        default: "dev"
        type: choice
        options:
          - dev
          - snapshot
          - release
      test-release:
        description: "Build and sign as a release, without publishing one"
        required: false
        default: false
        type: boolean
      aws-s3-uri:
        description: "Override AWS S3 target (e.g. s3://bucket/path)"
        required: false
        type: string
      platform:
        description: "Build only one platform (blank = all)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - windows
          - macos
          - linux
  push:
    branches: [master*]
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: "0 5 * * *" # 5am UTC nightly snapshot

# Cancel superseded PR builds; pushes to branches/tags always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PACKAGE_PREFIX: ${{ vars.SYNERGY_PACKAGE_PREFIX || 'synergy' }}
  PACKAGE_PATH: ./dist
  CMAKE_CONFIGURE: "cmake -Bbuild -DCMAKE_BUILD_TYPE=Release -DSKIP_BUILD_TESTS=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON"

  # Release shape, propagated to cmake (Synergy.cmake reads these as options).
  # Release events + explicit "release" workflow_dispatch input → release build.
  # Push to a master branch + schedule + explicit "snapshot" dispatch → snapshot build.
  # PRs and "dev" dispatch fall through to dev (the cmake default).
  #
  # The "test-release" dispatch input builds a release in everything but where it
  # lands: it signs, so the signing path can be exercised without cutting a release,
  # but it uploads to a test directory and never reaches the website, which only a
  # release event does. Signing is the one part of a release no other event runs,
  # and it has broken between releases through no change of ours.
  SYNERGY_VERSION_RELEASE: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.package-type == 'release') || inputs.test-release == true }}
  SYNERGY_TEST_RELEASE: ${{ inputs.test-release == true }}
  SYNERGY_VERSION_SNAPSHOT: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.package-type == 'snapshot') }}

  # Product values, set per repository so a fork building this code (synergy-ee)
  # ships as itself. Every one of these must reach cmake on the configure lines
  # below: a value declared here and read by nothing builds the wrong product
  # without failing anything.
  SYNERGY_PRODUCT_NAME: ${{ vars.SYNERGY_PRODUCT_NAME }}
  SYNERGY_ENABLE_ACTIVATION: ${{ vars.SYNERGY_ENABLE_ACTIVATION || 'ON' }}
  SYNERGY_VERSION_CHECK: ${{ vars.SYNERGY_VERSION_CHECK || 'ON' }}

jobs:
  # Quality gate to allow PR merge, used in the branch protection rules.
  ci-passed:
    runs-on: ubuntu-latest
    needs: [get-version, build-windows, build-macos, build-linux, build-flatpak]
    if: always()

    steps:
      # 'skipped' is treated as passing because the user/event deliberately
      # filtered the platform set (workflow_dispatch with inputs.platform=windows
      # skips macos+linux jobs). A failed job is still a failure. get-version never
      # filters out, so requiring it catches a build skipped by its failure.
      - name: Check all jobs passed or were intentionally skipped
        run: |
          ok() {
            [[ "$1" == "success" || "$1" == "skipped" ]]
          }
          if ok "${{needs.get-version.result}}" \
             && ok "${{needs.build-windows.result}}" \
             && ok "${{needs.build-macos.result}}" \
             && ok "${{needs.build-linux.result}}" \
             && ok "${{needs.build-flatpak.result}}"; then
            echo "✅ CI passed" > $GITHUB_STEP_SUMMARY
          else
            exit 1
          fi

  lint-clang:
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint Checker
        uses: ./.github/actions/lint-clang

  analyze-valgrind:
    needs: lint-clang
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/valgrind-analysis.yml

  get-version:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get version
        id: get-version
        uses: ./.github/actions/get-version

      # Nothing consumes the metainfo changelog at build time, so a release can ship without
      # its entry and software centres keep advertising the previous version. Compare against
      # GitHub releases rather than git tags: the tree also carries Deskflow's upstream tags.
      # Forks publish their own releases on their own version lines, which this changelog does
      # not cover, so the question only has an answer in the repository the releases come from.
      - name: Check metainfo covers the latest release
        if: github.repository == 'symless/synergy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          metainfo=extra/deploy/linux/com.symless.synergy.metainfo.xml
          tag=$(gh release list --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName')
          version=$(echo "$tag" | sed -E 's/^v//; s/-.*$//')
          if ! grep -q "<release version=\"$version\"" "$metainfo"; then
            echo "::error::$metainfo has no <release> entry for $version (latest release $tag)"
            exit 1
          fi
          echo "metainfo covers $version"

  build-windows:
    needs: [lint-clang, get-version]
    if: ${{ inputs.platform == '' || inputs.platform == 'windows' }}
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runs-on }}
    timeout-minutes: 30

    env:
      # esigner-codesign installs Corretto 11 when JAVA_VERSION < 11; none exists for
      # Windows/arm64, so pin >= 11 to skip that install and use the preinstalled JDK.
      JAVA_VERSION: "21"

    strategy:
      fail-fast: false
      matrix:
        target:
          - name: "windows-2022-x64"
            runs-on: "windows-2022"
            vcpkg-triplet: x64-windows-release
            arch: "amd64"
            qt-version: 6.10.3

          - name: "windows-2022-arm64"
            runs-on: "windows-11-arm"
            vcpkg-triplet: arm64-windows
            arch: "arm64"
            qt-version: 6.11.1

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      # Effectively runs vcvarsall.bat. VC++ itself is already pre-installed on the runner.
      - name: Setup VC++ environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.target.arch }}
          spectre: true

      - name: Install dependencies
        id: get-deps
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: ${{ matrix.target.qt-version }}
          vcpkg-triplet: ${{ matrix.target.vcpkg-triplet }}

      - name: Update Windows Paths
        shell: pwsh
        run: echo "C:\Program Files\doxygen\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        run: ${{ env.CMAKE_CONFIGURE }} -G Ninja ${{ steps.get-deps.outputs.vcpkg-cmake-config }} -DSYNERGY_VERSION_RELEASE=${{ env.SYNERGY_VERSION_RELEASE }} -DSYNERGY_VERSION_SNAPSHOT=${{ env.SYNERGY_VERSION_SNAPSHOT }} -DSYNERGY_PACKAGE_PREFIX=${{ env.PACKAGE_PREFIX }} -DSYNERGY_PRODUCT_NAME="${{ env.SYNERGY_PRODUCT_NAME }}" -DSYNERGY_ENABLE_ACTIVATION=${{ env.SYNERGY_ENABLE_ACTIVATION }} -DSYNERGY_VERSION_CHECK=${{ env.SYNERGY_VERSION_CHECK }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release -j8

      # CodeSignTool runs on a JDK from January 2019 that it bundles, whose trust
      # store cannot hold the root SSL.com moved their signing API to, so its calls
      # fail the TLS handshake. This JDK is installed for its trust store alone; the
      # signing tool still runs on its own.
      - name: Install a current CA trust store
        if: env.SYNERGY_VERSION_RELEASE == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          check-latest: true

      - name: Point the signing tool at the trust store
        if: env.SYNERGY_VERSION_RELEASE == 'true'
        shell: pwsh
        run: |
          $store = "$env:JAVA_HOME\lib\security\cacerts"
          if (-not (Test-Path $store)) { throw "no trust store at $store" }
          "JAVA_TOOL_OPTIONS=-Djavax.net.ssl.trustStore=$store -Djavax.net.ssl.trustStorePassword=changeit" |
            Out-File $env:GITHUB_ENV -Append

      # Inner binaries (synergy-core.exe, synergy.exe, synergy-daemon.exe) must
      # be signed BEFORE the MSI is built — WiX embeds them into the installer,
      # and signing the MSI afterward doesn't propagate signatures to embedded
      # files. Stages all non-test exes into one dir so they can be batch-signed
      # with a single OTP, then restores them in-place before the package step.
      - name: Stage binaries for signing
        if: env.SYNERGY_VERSION_RELEASE == 'true'
        shell: pwsh
        run: |
          $stageIn = "$env:RUNNER_TEMP\sign-stage\in"
          $stageOut = "$env:RUNNER_TEMP\sign-stage\out"
          New-Item -ItemType Directory -Force -Path $stageIn, $stageOut | Out-Null
          $exes = Get-ChildItem build/bin/*.exe | Where-Object { $_.Name -notmatch 'test' }
          if (-not $exes) { throw "no binaries found in build/bin to sign" }
          foreach ($exe in $exes) { Copy-Item $exe.FullName "$stageIn\$($exe.Name)" -Force }

      - name: Sign inner binaries
        if: env.SYNERGY_VERSION_RELEASE == 'true'
        uses: SSLcom/esigner-codesign@develop
        with:
          command: batch_sign
          username: ${{ secrets.WINDOWS_SSL_USERNAME }}
          password: ${{ secrets.WINDOWS_SSL_PASSWORD }}
          credential_id: ${{ secrets.WINDOWS_SSL_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.WINDOWS_SSL_TOTP_SECRET }}
          dir_path: ${{ runner.temp }}\sign-stage\in
          output_path: ${{ runner.temp }}\sign-stage\out
          environment_name: PROD

          # The pre-sign malware scan draws on a separate, much smaller quota than signing and
          # exhausts it across a full release; signing produces a valid signature without it.
          malware_block: "false"

      - name: Restore + verify signed binaries
        if: env.SYNERGY_VERSION_RELEASE == 'true'
        shell: pwsh
        run: |
          Get-ChildItem "$env:RUNNER_TEMP\sign-stage\out\*.exe" | ForEach-Object {
            $dst = "build/bin/$($_.Name)"
            Copy-Item $_.FullName $dst -Force
            $sig = Get-AuthenticodeSignature $dst
            if ($sig.Status -ne 'Valid') { throw "signature check failed on $dst (Status: $($sig.Status))" }
            Write-Host "OK: $dst signed by $($sig.SignerCertificate.Subject)"
          }

      - name: Package
        shell: bash
        run: cmake --build build --config Release -j8 --target package

      - name: Locate MSI
        if: env.SYNERGY_VERSION_RELEASE == 'true'
        id: locate-msi
        shell: pwsh
        run: |
          $msi = (Get-ChildItem build/*.msi | Select-Object -First 1).FullName
          if (-not $msi) { throw "no MSI found in build/" }
          "path=$msi" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Sign MSI
        if: env.SYNERGY_VERSION_RELEASE == 'true'
        uses: SSLcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.WINDOWS_SSL_USERNAME }}
          password: ${{ secrets.WINDOWS_SSL_PASSWORD }}
          credential_id: ${{ secrets.WINDOWS_SSL_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.WINDOWS_SSL_TOTP_SECRET }}
          file_path: ${{ steps.locate-msi.outputs.path }}
          override: "true"
          # The pre-sign malware scan draws on a separate, much smaller quota than signing and
          # exhausts it across a full payload; signing produces a valid signature without it.
          malware_block: "false"
          environment_name: PROD

      - name: Verify MSI is signed
        if: env.SYNERGY_VERSION_RELEASE == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "${{ steps.locate-msi.outputs.path }}"
          if ($sig.Status -ne 'Valid') { throw "MSI not signed (Status: $($sig.Status))" }
          Write-Host "OK: MSI signed by $($sig.SignerCertificate.Subject)"

      - name: Tests
        uses: ./.github/actions/run-tests
        timeout-minutes: 2

      - name: Test package
        uses: ./.github/actions/test-package

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ env.PACKAGE_PREFIX }}-${{ needs.get-version.outputs.version }}-${{ matrix.target.name }}
          path: ${{ github.workspace }}/build/${{ env.PACKAGE_PREFIX }}[-_]*.*

  build-macos:
    needs: [lint-clang, get-version]
    if: ${{ inputs.platform == '' || inputs.platform == 'macos' }}
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runs-on }}
    timeout-minutes: ${{ matrix.target.timeout }}

    env:
      MAC_SIGNING: ${{ secrets.APPLE_CODESIGN_ID != '' }}

    strategy:
      fail-fast: false
      matrix:
        target:
          - name: "macos-arm64"
            runs-on: macos-15
            timeout: 10
            qt-version: 6.11.1
            # Deployment target is set once in extra/cmake/Synergy.cmake (single
            # source of truth); don't pass -DCMAKE_OSX_DEPLOYMENT_TARGET here.
            config-args: '-DCMAKE_OSX_ARCHITECTURES="arm64"'

          - name: "macos-x64"
            runs-on: macos-15-intel
            timeout: 20
            qt-version: 6.9.3
            config-args: '-DCMAKE_OSX_ARCHITECTURES="x86_64" -DCMAKE_OSX_SYSROOT=/Applications/Xcode_16.4.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: ${{ matrix.target.qt-version }}

      - name: Configure
        run: ${{ env.CMAKE_CONFIGURE }} ${{ matrix.target.config-args }} -DSYNERGY_VERSION_RELEASE=${{ env.SYNERGY_VERSION_RELEASE }} -DSYNERGY_VERSION_SNAPSHOT=${{ env.SYNERGY_VERSION_SNAPSHOT }} -DSYNERGY_PACKAGE_PREFIX=${{ env.PACKAGE_PREFIX }} -DSYNERGY_PRODUCT_NAME="${{ env.SYNERGY_PRODUCT_NAME }}" -DSYNERGY_ENABLE_ACTIVATION=${{ env.SYNERGY_ENABLE_ACTIVATION }} -DSYNERGY_VERSION_CHECK=${{ env.SYNERGY_VERSION_CHECK }} -DAPPLE_CODESIGN_ID="${{ secrets.APPLE_CODESIGN_ID }}"

      - name: Build
        shell: bash
        run: cmake --build build --config Release -j8

      # Create an ephemeral keychain just for this run and import the Developer
      # ID Application certificate from the base64-encoded P12 in secrets. Using
      # a per-run keychain (rather than System.keychain) keeps the cert out of
      # any shared state on the runner; the keychain is destroyed at job end.
      # set-key-partition-list grants codesign passwordless access so the later
      # sign step doesn't prompt.
      - name: Set up signing keychain
        if: env.MAC_SIGNING == 'true'
        shell: bash
        env:
          APPLE_P12_CERTIFICATE: ${{ secrets.APPLE_P12_CERTIFICATE }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/sign.keychain-db"
          keychain_pass=$(openssl rand -base64 32)
          security create-keychain -p "$keychain_pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_pass" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d ' "')
          cert_file="$RUNNER_TEMP/cert.p12"
          echo "$APPLE_P12_CERTIFICATE" | base64 --decode > "$cert_file"
          security import "$cert_file" -k "$keychain" -P "$APPLE_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_pass" "$keychain"
          rm -f "$cert_file"
          echo "SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN_PASS=$keychain_pass" >> "$GITHUB_ENV"

      # CPack runs macdeployqt and, when a Developer ID is configured, codesigns
      # the bundle that gets embedded in the DMG (see deploy/mac/deploy.cmake), so
      # the keychain must be unlocked first. CPack on macOS is flaky; retry a
      # handful of times before failing.
      - name: Package
        shell: bash
        run: |
          if [ -n "$SIGN_KEYCHAIN" ]; then
            security unlock-keychain -p "$SIGN_KEYCHAIN_PASS" "$SIGN_KEYCHAIN"
          fi
          for i in $(seq 1 5); do
            if cmake --build build --config Release -j8 --target package 2>&1; then
              echo "Package successful"
              exit 0
            fi
            echo "Package attempt $i failed"
            sleep 1
          done
          echo "ERROR: package failed after 5 attempts" >&2
          exit 1

      # Sign the DMG itself so Gatekeeper trusts it before extraction. Then
      # submit to notarytool (synchronous via --wait) and staple the returned
      # ticket so Gatekeeper can verify offline.
      - name: Sign + notarize + staple DMG
        if: env.MAC_SIGNING == 'true'
        shell: bash
        env:
          APPLE_CODESIGN_ID: ${{ secrets.APPLE_CODESIGN_ID }}
          APPLE_NOTARY_USER: ${{ secrets.APPLE_NOTARY_USER }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg=$(find build -maxdepth 2 -name "*.dmg" -type f | head -n1)
          if [ -z "$dmg" ]; then
            echo "ERROR: no DMG found under build/" >&2
            find build -maxdepth 2 -name "*.dmg" 2>/dev/null
            exit 1
          fi
          echo "Found DMG: $dmg"

          security unlock-keychain -p "$SIGN_KEYCHAIN_PASS" "$SIGN_KEYCHAIN"
          /usr/bin/codesign --force --timestamp --sign "$APPLE_CODESIGN_ID" "$dmg"

          result=$(xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_NOTARY_USER" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json --wait)
          echo "$result"
          id=$(echo "$result" | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")
          status=$(echo "$result" | python3 -c "import sys, json; print(json.load(sys.stdin)['status'])")
          if [ "$status" != "Accepted" ]; then
            echo "Notarization $status; per-file detail follows:" >&2
            xcrun notarytool log "$id" \
              --apple-id "$APPLE_NOTARY_USER" \
              --password "$APPLE_NOTARY_PASSWORD" \
              --team-id "$APPLE_TEAM_ID"
            exit 1
          fi

          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -t open --context context:primary-signature -v "$dmg"
          echo "DMG signed + notarized + stapled: $dmg"

      - name: Tests
        uses: ./.github/actions/run-tests
        timeout-minutes: 2

      - name: Test package
        uses: ./.github/actions/test-package

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ env.PACKAGE_PREFIX }}-${{ needs.get-version.outputs.version }}-${{ matrix.target.name }}
          path: ${{ github.workspace }}/build/${{ env.PACKAGE_PREFIX }}[-_]*.*

  build-linux:
    needs: [lint-clang, get-version]
    if: ${{ inputs.platform == '' || inputs.platform == 'linux' }}
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runs-on }}
    container: ${{ matrix.target.container }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Each leg builds in its distro's own container against that distro's libraries, so
        # the package matches what users have installed. Legs without libei or libportal
        # >= 0.8 build X11-only. Drop a leg once its distro is EOL (Ubuntu 22.04: 2027-06).
        target:
          - name: "debian-13-x86_64"
            runs-on: ubuntu-latest
            container: debian:13-slim
            like: "debian"
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"

          - name: "debian-13-arm64"
            runs-on: ubuntu-24.04-arm
            container: debian:13-slim
            like: "debian"
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"

          # Debian 12's GCC 12 trips -Wstringop-overflow false positives (gone in GCC 13),
          # so warnings-as-errors is off here; the GCC 13+ legs keep it on.
          - name: "debian-12-x86_64"
            runs-on: ubuntu-latest
            container: debian:12-slim
            like: "debian"
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF"

          - name: "debian-12-arm64"
            runs-on: ubuntu-24.04-arm
            container: debian:12-slim
            like: "debian"
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF"

          - name: "fedora-42-x86_64"
            runs-on: ubuntu-latest
            container: fedora:42
            like: "fedora"
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"

          - name: "fedora-42-arm64"
            runs-on: ubuntu-24.04-arm
            container: fedora:42
            like: "fedora"
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"

          - name: "fedora-43-x86_64"
            runs-on: ubuntu-latest
            container: fedora:43
            like: "fedora"
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"

          - name: "fedora-43-arm64"
            runs-on: ubuntu-24.04-arm
            container: fedora:43
            like: "fedora"
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"

          - name: "fedora-44-x86_64"
            runs-on: ubuntu-latest
            container: fedora:44
            like: "fedora"
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"

          - name: "fedora-44-arm64"
            runs-on: ubuntu-24.04-arm
            container: fedora:44
            like: "fedora"
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"

          # RHEL/Rocky: Qt5, X11-only, tests off (the suite needs Qt6 Test).
          - name: "rocky-8-x86_64"
            runs-on: ubuntu-latest
            container: rockylinux:8
            like: "rhel"
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTS=OFF -DQT_VERSION_OVERRIDE=5.13 -DOPENSSL_VERSION_OVERRIDE=1.1.1"

          - name: "rocky-9-x86_64"
            runs-on: ubuntu-latest
            container: rockylinux:9
            like: "rhel"
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTS=OFF -DQT_VERSION_OVERRIDE=5.13 -DOPENSSL_VERSION_OVERRIDE=1.1.1"

          - name: "opensuse-x86_64"
            runs-on: ubuntu-latest
            container: opensuse/tumbleweed:latest
            like: "suse"
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"

          - name: "opensuse-arm64"
            runs-on: ubuntu-24.04-arm
            container: opensuse/tumbleweed:latest
            like: "suse"
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"

          - name: "archlinux-x86_64"
            runs-on: ubuntu-latest
            container: archlinux:latest
            like: "arch"
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_DEV_DOCS=ON"

          - name: "manjaro-x86_64"
            runs-on: ubuntu-latest
            container: manjarolinux/base:latest
            like: "arch"
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"

          - name: "ubuntu-22.04-x86_64"
            runs-on: ubuntu-latest
            container: ubuntu:22.04
            like: "debian"
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF -DQT_VERSION_OVERRIDE=6.2.0"

          - name: "ubuntu-22.04-arm64"
            runs-on: ubuntu-24.04-arm
            container: ubuntu:22.04
            like: "debian"
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF -DQT_VERSION_OVERRIDE=6.2.0"

          - name: "ubuntu-24.04-x86_64"
            runs-on: ubuntu-latest
            container: ubuntu:24.04
            like: "debian"
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"

          - name: "ubuntu-24.04-arm64"
            runs-on: ubuntu-24.04-arm
            container: ubuntu:24.04
            like: "debian"
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"

          - name: "ubuntu-26.04-x86_64"
            runs-on: ubuntu-latest
            container: ubuntu:26.04
            like: "debian"
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"

          - name: "ubuntu-26.04-arm64"
            runs-on: ubuntu-24.04-arm
            container: ubuntu:26.04
            like: "debian"
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"

    steps:
      # Containers don't ship git; everything else needs it for checkout + describe.
      - name: Install Git on Container
        shell: bash
        run: |
          if [ "${{ matrix.target.like }}" == "debian" ]; then
            apt update -qqq > /dev/null && apt install -qqq git devscripts > /dev/null
          elif [ "${{ matrix.target.like }}" == "fedora" ]; then
            dnf install -y git
          elif [ "${{ matrix.target.like }}" == "suse" ]; then
            zypper refresh
            zypper install -y --force-resolution git
          elif [ "${{ matrix.target.like }}" == "arch" ]; then
            pacman -Syu --noconfirm git
          elif [ "${{ matrix.target.like }}" == "rhel" ]; then
            dnf install -y git
          else
            echo "Unknown: ${{ matrix.target.like }}"
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      # The container runs as root over a host-owned workspace, so git rejects it as
      # dubious-owned and the Configure step's `git describe` degrades the rev count
      # to 0, naming packages +r0 while non-container builds use the real count.
      - name: Trust workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          like: ${{ matrix.target.like }}

      # Jammy's default GCC 11 has no std::make_shared<T[]> (C++20; libstdc++ gained it in
      # GCC 12). g++-12 is in jammy's own archive and its libstdc++6 runtime is already
      # what the distro ships, so the package still links only 22.04's libraries.
      - name: Use GCC 12 (Ubuntu 22.04)
        if: startsWith(matrix.target.name, 'ubuntu-22.04')
        shell: bash
        run: |
          apt-get install -y -qq g++-12
          echo "CC=gcc-12" >> "$GITHUB_ENV"
          echo "CXX=g++-12" >> "$GITHUB_ENV"

      # 24.04's system libportal (0.7.x) lacks the input-capture portal the code needs
      # (>= 0.8.0), and that LTS's libs are frozen. Build a newer libportal and static-link
      # it so the shipped binary carries no runtime dependency on a >= 0.8 system libportal
      # (libei from the system is fine). The code uses no xdp_parent, so no GUI backend is
      # needed, and removing the system .so makes `-lportal` resolve to the static archive.
      - name: Build newer libportal (Ubuntu 24.04)
        if: startsWith(matrix.target.name, 'ubuntu-24.04')
        shell: bash
        run: |
          apt-get install -y -qq meson pkg-config
          git clone --depth 1 --branch 0.9.1 https://github.com/flatpak/libportal.git /tmp/libportal
          meson setup /tmp/libportal/_build /tmp/libportal --prefix=/usr --libdir=lib/$(gcc -dumpmachine) \
            --default-library=static \
            -Dbackend-gtk3=disabled -Dbackend-gtk4=disabled -Dbackend-qt5=disabled -Dbackend-qt6=disabled \
            -Ddocs=false -Dintrospection=false -Dvapi=false -Dtests=false
          meson install -C /tmp/libportal/_build
          rm -f /usr/lib/$(gcc -dumpmachine)/libportal.so*
          ldconfig

      - name: Configure
        run: ${{ env.CMAKE_CONFIGURE }} ${{ matrix.target.config-args }} -DSYNERGY_VERSION_RELEASE=${{ env.SYNERGY_VERSION_RELEASE }} -DSYNERGY_VERSION_SNAPSHOT=${{ env.SYNERGY_VERSION_SNAPSHOT }} -DSYNERGY_PACKAGE_PREFIX=${{ env.PACKAGE_PREFIX }} -DSYNERGY_PRODUCT_NAME="${{ env.SYNERGY_PRODUCT_NAME }}" -DSYNERGY_ENABLE_ACTIVATION=${{ env.SYNERGY_ENABLE_ACTIVATION }} -DSYNERGY_VERSION_CHECK=${{ env.SYNERGY_VERSION_CHECK }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release -j8

      - name: Package
        shell: bash
        run: |
          if [[ "${{ matrix.target.like }}" == "arch" ]]; then
            useradd -m build
            sudo chown -R build build
            cd build
            sudo -u build makepkg -s
            export OSNAME=$(cat /etc/os-release | grep ^ID= | sed 's/ID=//g')
            [ "$OSNAME" = "arch" ] && OSNAME="arch-linux"
            export ARCH=$(uname -m)
            mv *.pkg.tar.zst ${{ env.PACKAGE_PREFIX }}_${{ needs.get-version.outputs.version }}_${OSNAME}_${ARCH}.pkg.tar.zst
            cd ..
          else
            cmake --build build --config Release -j8 --target package
          fi

      - name: Tests
        if: ${{ matrix.target.like != 'rhel' }}
        uses: ./.github/actions/run-tests
        timeout-minutes: 2

      - name: Test package
        uses: ./.github/actions/test-package
        with:
          like: ${{ matrix.target.like }}

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ env.PACKAGE_PREFIX }}-${{ needs.get-version.outputs.version }}-${{ matrix.target.name }}
          path: ${{ github.workspace }}/build/${{ env.PACKAGE_PREFIX }}[-_]*.*

  build-flatpak:
    needs: [lint-clang, get-version]
    if: ${{ inputs.platform == '' || inputs.platform == 'linux' }}
    name: flatpak-${{matrix.flatpak.arch}}
    runs-on: ${{matrix.flatpak.runs-on}}
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        flatpak:
          - runs-on: ubuntu-latest
            arch: x86_64
          - runs-on: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - run: git config --global protocol.file.allow always

      # flatpak-builder can't take cmake args, so the build's version flags live
      # in the manifest. Flip them to match the event; fail loudly if they ever
      # go missing rather than silently shipping a dev build.
      - name: Set version flags
        run: |
          manifest=extra/deploy/linux/flatpak/com.symless.synergy.yml
          set -- \
            "SYNERGY_VERSION_RELEASE=$SYNERGY_VERSION_RELEASE" \
            "SYNERGY_VERSION_SNAPSHOT=$SYNERGY_VERSION_SNAPSHOT" \
            "SYNERGY_PRODUCT_NAME=$SYNERGY_PRODUCT_NAME" \
            "SYNERGY_ENABLE_ACTIVATION=$SYNERGY_ENABLE_ACTIVATION" \
            "SYNERGY_VERSION_CHECK=$SYNERGY_VERSION_CHECK"
          for pair in "$@"; do
            flag=${pair%%=*}
            grep -q -- "-D$flag=" "$manifest" \
              || { echo "::error::$flag missing from $manifest"; exit 1; }
            # Value runs to the closing quote, so a product name with spaces survives.
            sed -i "s|-D$flag=[^\"]*|-D$pair|" "$manifest"
          done

      - name: Lint appsteam
        run: flatpak-builder-lint appstream extra/deploy/linux/com.symless.synergy.metainfo.xml

      - name: Lint manifest
        run: flatpak-builder-lint manifest extra/deploy/linux/flatpak/com.symless.synergy.yml

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ env.PACKAGE_PREFIX }}_${{ needs.get-version.outputs.version }}_linux_${{ matrix.flatpak.arch }}.flatpak
          manifest-path: extra/deploy/linux/flatpak/com.symless.synergy.yml
          cache-key: flatpak-builder-${{matrix.flatpak.arch}}-2.0
          arch: ${{matrix.flatpak.arch}}
          upload-artifact: false

      - name: Validate build
        run: flatpak-builder-lint --exceptions --user-exceptions extra/deploy/linux/flatpak/ci-build-lint-exceptions.json repo repo

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ env.PACKAGE_PREFIX }}-${{ needs.get-version.outputs.version }}-flatpak-${{matrix.flatpak.arch}}
          path: ${{github.workspace}}/${{ env.PACKAGE_PREFIX }}[-_]*.flatpak

  # Upload all packages that built to AWS S3 for distribution. Runs after the
  # build jobs on push/dispatch/release events (PRs skipped, no secrets), and
  # uploads whatever artifacts exist — one failed target must not block shipping
  # the rest (a flaky distro shouldn't sink a whole nightly snapshot). Gated only
  # on get-version, which supplies the path. Layout: <dir>/<dev|snapshot|release>/<version>/...
  s3-upload:
    needs: [get-version, build-windows, build-macos, build-linux, build-flatpak]
    if: ${{ always() && needs.get-version.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'release') }}
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Upload to AWS S3
        shell: bash
        run: |
          version="${{ needs.get-version.outputs.version }}"
          s3_uri="${{ inputs.aws-s3-uri || format('s3://{0}/{1}', vars.AWS_S3_BUCKET, vars.AWS_S3_UPLOAD_DIR) }}"
          s3_uri="${s3_uri%/}"

          if [[ "${{ env.SYNERGY_TEST_RELEASE }}" == "true" ]]; then
            # Built as a release and named like one, so it is kept out of the
            # release folder where it would be indistinguishable from the real one.
            sub_dir="test"
          elif [[ "${{ env.SYNERGY_VERSION_RELEASE }}" == "true" ]]; then
            sub_dir="release"
          elif [[ "${{ env.SYNERGY_VERSION_SNAPSHOT }}" == "true" ]]; then
            # Group snapshots by base version, keeping the stage so the folder
            # matches the release path (i.e. 1.21.2-beta/1.21.2-beta-snapshot+r42).
            base_version="${version%%-snapshot*}"
            sub_dir="snapshot/$base_version"
          else
            sub_dir="dev"
          fi

          url="$s3_uri/$sub_dir/$version"
          echo "Uploading to AWS S3: $url"
          aws s3 cp ./dist/ "$url" --recursive

  # Tell the website about the release, so its download page gets rows without
  # anybody creating them by hand. The website writes the notes and holds the
  # release as a draft until a person approves it, so this never publishes.
  # Unlike s3-upload there is deliberately no always(): a build that failed must
  # take this with it, so a release is never created half true. s3-upload is a
  # dependency for ordering as much as for safety, because the website starts
  # copying the packages out of the bucket as soon as it is told about them.
  website:
    needs: [get-version, build-windows, build-macos, build-linux, build-flatpak, s3-upload]
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Create website release
        shell: bash
        env:
          SYNERGY_VERSION: ${{ needs.get-version.outputs.version }}
          SYNERGY_RELEASE_TAG: ${{ github.ref_name }}
          SYNERGY_PACKAGE_DIR: ${{ github.workspace }}/dist
          SYNERGY_FILE_CODES: ${{ vars.SYNERGY_FILE_CODES }}
          WEBSITE_API_TOKEN: ${{ secrets.WEBSITE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: bash extra/scripts/create-website-release.sh

  report:
    needs: [get-version, build-windows, build-macos, build-linux, build-flatpak, s3-upload, website]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Build Slack message
        id: message
        shell: bash
        run: |
          link="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "text<<EOF"
            echo "<!channel>"
            echo "❌ Synergy CI failed"
            [ "${{ needs.build-windows.result }}" = "failure" ] && echo "• Windows build failed"
            [ "${{ needs.build-macos.result }}" = "failure" ] && echo "• macOS build failed"
            [ "${{ needs.build-linux.result }}" = "failure" ] && echo "• Linux build failed"
            [ "${{ needs.build-flatpak.result }}" = "failure" ] && echo "• Flatpak build failed"
            [ "${{ needs.s3-upload.result }}" = "failure" ] && echo "• S3 upload failed"
            [ "${{ needs.website.result }}" = "failure" ] && echo "• Website release failed"
            echo "<$link|View workflow>"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_NOTIFY_CHANNEL_ID }}
            text: ${{ toJSON(steps.message.outputs.text) }}
