name: Test version

on:
  pull_request:
    
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Configure
        run: cmake -P ext/synergy-extra/cmake/SaveVersion.cmake --verbose

      - name: Set version env var
        run: |
          version=$(cat VERSION)
          if [[ -z "$version" ]]; then
            echo "File VERSION is empty"
            exit 1
          fi

          echo "Version: $version"
          echo "VERSION=$version" >> $GITHUB_ENV
