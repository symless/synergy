name: "Copy binaries for distribution"

inputs:
  source-dir:
    description: "The source directory where the binaries are located."

  target-dir:
    description: "The target directory where the binaries will be copied."

outputs:
  copy-done:
    description: "Indicates whether the copy happened."
    value: ${{ steps.copy.outputs.copy-done }}
    

runs:
  using: "composite"

  steps:
    - run: |
        cd "${{ inputs.source-dir }}"
        mkdir -p "${{ inputs.target-dir }}"
        ls -al *

        if [ "${{ runner.os }}" == "Windows" ]; then

          if [ ! -f synergy-core.exe ]; then
            echo "Unified core not found, skipping copy."
            exit 0
          fi
          
          cp -v \
            synergy-core.exe \
            synergy-daemon.exe \
            syntool.exe \
            libcrypto-3-x64.dll \
            libssl-3-x64.dll \
            "${{ inputs.target-dir }}"
        else

          if [ ! -f synergy-core ]; then
            echo "Unified core not found, skipping copy."
            exit 0
          fi

          cp -v \
            synergy-core \
            syntool \
            "${{ inputs.target-dir }}"
        fi

        echo "Binaries copied to ${{ inputs.target-dir }}"
        echo "done=true" >> $GITHUB_OUTPUT
      shell: bash
      id: copy
