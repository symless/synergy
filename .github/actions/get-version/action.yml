name: "Get version"
description: "Use CMake to get the version"

outputs:
  version:
    description: "Version number generated by CMake"
    value: ${{ steps.get-version.outputs.version }}

runs:
  using: "composite"

  steps:
      - name: Configure
        run: cmake --log-level VERBOSE -DVERSION_FILE=build/VERSION -P ext/synergy-extra/cmake/SaveVersion.cmake
        shell: bash

      - name: Get version
        id: get-version
        run: |
          version=$(cat VERSION)
          if [[ -z "$version" ]]; then
            echo "File VERSION is empty"
            exit 1
          fi

          echo "Version: $version"
          echo "version=$version" >> $GITHUB_OUTPUT
        shell: bash
